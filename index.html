<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Patates Qui Parlent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Nunito:wght@600;800&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: one screen. Top bar (score, next potato), the potato jar (canvas) centered, the evolution chain under it */
:root {
  --bg: #1d1a2f;
  --bg2: #2a2545;
  --fg: #f6f1ff;
  --muted: #a9a2c7;
  --accent: #ffcf4a;
  --jar: #322c52;
  --danger: #ff6b7a;
  --display: "Rubik Mono One", "Arial Black", Impact, sans-serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg));
  color: var(--fg);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 420px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--display); font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--muted); }
#nextCv { width: 44px; height: 44px; }
#caption {
  font-family: var(--display); font-size: clamp(16px, 4.6vw, 26px); color: var(--accent);
  min-height: 1.3em; text-align: center; line-height: 1.2;
}
#caption.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.08) } 100% { transform: scale(1); opacity: 1 } }
.stage { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; }
#cv { display: block; border-radius: 18px; touch-action: none; cursor: pointer; background: var(--jar); box-shadow: inset 0 0 0 3px #4a4275; }
.over {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  text-align: center;
}
.over .card { background: rgba(20,17,36,.88); padding: 24px 28px; border-radius: 18px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.over h2 { font-family: var(--display); margin: 0; font-size: 24px; color: var(--danger); text-align: center; }
.over h2.win { color: var(--accent); }
.over p { margin: 0; color: var(--muted); font-weight: 800; }
button {
  font-family: var(--display); font-size: 15px;
  background: var(--accent); color: #2a1f00; border: 0; border-radius: 999px;
  padding: 12px 22px; cursor: pointer; box-shadow: 0 5px 0 #b8901f;
}
button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8901f; }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.ghost { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 2px var(--muted); font-size: 12px; padding: 8px 14px; }
.ghost:active { box-shadow: inset 0 0 0 2px var(--muted); }
.chain { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 6px; max-width: 420px; }
.chain .lv { display: flex; flex-direction: column; align-items: center; font-size: 9px; font-weight: 800; color: var(--muted); letter-spacing: .04em; opacity: .45; }
.chain .lv.seen { opacity: 1; color: var(--fg); }
.chain .arr { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>


<div class="top">
  <div class="stat"><span>SCORE</span><b id="score">0</b></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
    <button class="ghost" id="mute" aria-pressed="false">🔊 Son</button>
    <button class="ghost" id="test">🗣️ Tester la voix</button>
  </div>
  <div class="stat" style="align-items:center"><span>SUIVANTE</span><canvas id="nextCv" width="88" height="88"></canvas></div>
</div>
<div id="caption">Lâche des WILLIAM !</div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="over" id="over" hidden>
    <div class="card">
      <h2 id="overTitle">LE BOCAL DÉBORDE</h2>
      <p id="finalScore"></p>
      <button id="again">Rejouer</button>
    </div>
  </div>
</div>
<div class="chain" id="chain"></div>

const RINGS = ['#ffd23f', '#ff8c2b', '#ff4f9a', '#3ddc84', '#3aa0ff', '#a259ff'];
const SOFT = 0.86;      // le corps physique est plus petit que le dessin : les patates s'écrasent les unes dans les autres
const BLOB_N = 32;
// Forme molle : un rond qui s'aplatit contre les voisins et les parois, et qui tremblote après un choc
function blobPath(ctx, x, y, r, body) {
  const pts = [];
  for (let i = 0; i < BLOB_N; i++) {
    const a = (i / BLOB_N) * Math.PI * 2, ux = Math.cos(a), uy = Math.sin(a);
    let rr = r;
    if (body) {
      // gelée : étirement / écrasement qui oscille
      rr *= 1 + body.wob * Math.cos(2 * (a - body.wobDir));
      // aplati contre les autres patates (frontière au milieu de la zone de contact)
      for (const o of potatoes) {
        if (o === body) continue;
        const dx = o.position.x - x, dy = o.position.y - y, d = Math.hypot(dx, dy);
        const ro = LEVELS[o.lv].r;
        if (d <= 0.001 || d >= r + ro) continue;
        const c = (ux * dx + uy * dy) / d;
        if (c <= 0.05) continue;
        const t = Math.max(r * .45, (d * d + r * r - ro * ro) / (2 * d));
        rr = Math.min(rr, t / c);
      }
      // aplati contre le sol et les murs
      if (uy > 0.05) rr = Math.min(rr, (H - y) / uy);
      if (ux > 0.05) rr = Math.min(rr, (W - x) / ux);
      if (ux < -0.05) rr = Math.min(rr, x / -ux);
      rr = Math.max(rr, r * .45);
    }
    pts.push([x + ux * rr, y + uy * rr]);
  }
  ctx.beginPath();
  const m = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  let s = m(pts[BLOB_N - 1], pts[0]);
  ctx.moveTo(s[0], s[1]);
  for (let i = 0; i < BLOB_N; i++) {
    const p = pts[i], e = m(p, pts[(i + 1) % BLOB_N]);
    ctx.quadraticCurveTo(p[0], p[1], e[0], e[1]);
  }
  ctx.closePath();
}

function drawPotato(ctx, x, y, r, lv, angle = 0, talk = 0, body = null) {
  const img = lv === N - 1 ? FACE_LAST : FACE;
  if (!img.complete || !img.naturalWidth) return drawPotatoOld(ctx, x, y, r, lv, angle, talk);
  r *= 1 + .07 * talk;
  ctx.save();
  blobPath(ctx, x, y, r, body);
  ctx.save(); ctx.clip();
  ctx.translate(x, y); ctx.rotate(angle);
  ctx.drawImage(img, -r, -r, r * 2, r * 2);
  ctx.restore();
  ctx.restore();
}
function drawPotatoOld(ctx, x, y, r, lv, angle = 0, talk = 0) {
  const h = LEVELS[lv].hue;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle);
  const g = ctx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r * 1.1);
  g.addColorStop(0, `hsl(${h} 72% 74%)`);
  g.addColorStop(.7, `hsl(${h} 56% 55%)`);
  g.addColorStop(1, `hsl(${h} 50% 38%)`);
  ctx.fillStyle = g;
  ctx.beginPath();
  // forme de patate un peu bosselée
  for (let a = 0; a <= Math.PI * 2 + .01; a += Math.PI / 16) {
    const k = 1 + .06 * Math.sin(a * 3 + lv) + .04 * Math.cos(a * 5);
    const px = Math.cos(a) * r * 1.02 * k, py = Math.sin(a) * r * .95 * k;
    a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  // taches
  ctx.fillStyle = `hsl(${h} 45% 35%)`;
  [[-.5, -.5, .06], [.55, .35, .07], [.3, -.65, .045]].forEach(([a, b, s]) => {
    ctx.beginPath(); ctx.arc(a * r, b * r, s * r, 0, 7); ctx.fill();
  });
  // yeux
  const ey = -r * .12, ex = r * .3, er = r * .17;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(-ex, ey, er, 0, 7); ctx.arc(ex, ey, er, 0, 7); ctx.fill();
  ctx.fillStyle = "#1d1a2f";
  ctx.beginPath(); ctx.arc(-ex + er * .2, ey + er * .2, er * .52, 0, 7); ctx.arc(ex + er * .2, ey + er * .2, er * .52, 0, 7); ctx.fill();
  // joues
  ctx.fillStyle = "rgba(255,138,138,.45)";
  ctx.beginPath(); ctx.ellipse(-r * .55, r * .2, r * .13, r * .08, 0, 0, 7); ctx.ellipse(r * .55, r * .2, r * .13, r * .08, 0, 0, 7); ctx.fill();
  // bouche
  ctx.fillStyle = "#3a1d10";
  ctx.beginPath(); ctx.ellipse(0, r * .32, r * .22, r * (.08 + .16 * talk), 0, 0, 7); ctx.fill();
  ctx.restore();
}

// ---------- Chaîne d'évolution ----------
const chainEl = document.getElementById('chain');
const seen = new Set([0]);
function buildChain() {
  chainEl.innerHTML = '';
  LEVELS.forEach((L, i) => {
    if (i) { const a = document.createElement('span'); a.className = 'arr'; a.textContent = '›'; chainEl.appendChild(a); }
    const d = document.createElement('div'); d.className = 'lv' + (seen.has(i) ? ' seen' : '');
    const c = document.createElement('canvas'); const s = 18 + i * 4; c.width = s * 2; c.height = s * 2; c.style.width = s + 'px'; c.style.height = s + 'px';
    const cx = c.getContext('2d'); cx.scale(2, 2); drawPotato(cx, s / 2, s / 2, s * .42, i);
    d.appendChild(c); const t = document.createElement('span'); t.textContent = L.name; d.appendChild(t);
    chainEl.appendChild(d);
  });
}
buildChain();

const synth = null;
let actx = null, muted = false, voiceBufs = [], curVoice = null;
function ensureAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      VOICES.forEach((b64, i) => {
        const bin = atob(b64), arr = new Uint8Array(bin.length);
        for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
        actx.decodeAudioData(arr.buffer, buf => { voiceBufs[i] = buf; }, () => {});
      });
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
let mergeVoiceUntil = 0;
function say(lv, isDrop = false) {
  if (muted || !actx || !voiceBufs[lv]) return;
  // le nom d'une fusion n'est jamais coupé par un simple lâcher
  if (isDrop && actx.currentTime < mergeVoiceUntil) return;
  if (!isDrop) mergeVoiceUntil = actx.currentTime + voiceBufs[lv].duration;
  try { if (curVoice) curVoice.stop(); } catch (e) {}
  const src = actx.createBufferSource(), g = actx.createGain();
  g.gain.value = 1.4;
  src.buffer = voiceBufs[lv]; src.connect(g).connect(actx.destination); src.start();
  curVoice = src;
}

function blip(lv) {
  if (muted) return;
  try {
    if (!actx) return;
    const o = actx.createOscillator(), gn = actx.createGain(), t = actx.currentTime;
    const f = 900 / Math.pow(1.45, lv);
    o.type = 'sine'; o.frequency.setValueAtTime(f * 1.6, t); o.frequency.exponentialRampToValueAtTime(f, t + .12);
    gn.gain.setValueAtTime(.25, t); gn.gain.exponentialRampToValueAtTime(.001, t + .25);
    o.connect(gn).connect(actx.destination); o.start(t); o.stop(t + .26);
  } catch (e) {}
}
const muteBtn = document.getElementById('mute');
muteBtn.onclick = () => {
  muted = !muted; muteBtn.textContent = muted ? '🔇 Muet' : '🔊 Son'; muteBtn.setAttribute('aria-pressed', muted);
  if (muted && curVoice) { try { curVoice.stop(); } catch (e) {} }
};

// ---------- Physique ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const nextCv = document.getElementById('nextCv'), nctx = nextCv.getContext('2d');
const stage = document.getElementById('stage');
let scale = 1;
function resize() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  scale = Math.max(.4, Math.min(sw / W, sh / H));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = W * scale * dpr; cv.height = H * scale * dpr;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize);

let hole = null, sucked = [], stars = [];
let engine, potatoes, score, nextLv, curLv, aimX, canDrop, gameOver, overTimer, particles, talking;
const scoreEl = document.getElementById('score'), captionEl = document.getElementById('caption');
const overEl = document.getElementById('over');

function randLv() { return 0; } // on ne lâche que des WILLIAM

function newGame() {
  engine = Engine.create(); engine.gravity.y = 1.1;
  const wall = { isStatic: true, friction: .2 };
  Composite.add(engine.world, [
    Bodies.rectangle(W / 2, H + 30, W * 2, 60, wall),
    Bodies.rectangle(-30, H / 2, 60, H * 3, wall),
    Bodies.rectangle(W + 30, H / 2, 60, H * 3, wall),
  ]);
  Events.on(engine, 'collisionStart', onCollide);
  Events.on(engine, 'collisionActive', onCollide);
  potatoes = new Set(); particles = []; talking = new Map();
  score = 0; scoreEl.textContent = 0;
  curLv = randLv(); nextLv = randLv(); drawNext();
  aimX = W / 2; canDrop = true; gameOver = false; overTimer = 0;
  overEl.hidden = true;
  hole = null; sucked = []; stars = [];
}

function addPotato(x, y, lv) {
  const b = Bodies.circle(x, y, LEVELS[lv].r * SOFT, { restitution: .6, friction: .4, frictionStatic: .6, density: .002 });
  b.lv = lv; b.born = performance.now(); b.wob = 0.18; b.wobV = 0; b.wobDir = 0;
  potatoes.add(b); Composite.add(engine.world, b);
  return b;
}

const pending = [];
function onCollide(e) {
  for (const p of e.pairs) {
    const a = p.bodyA, b = p.bodyB;
    if (a.lv === undefined || a.lv !== b.lv || a.merging || b.merging) continue;
    a.merging = b.merging = true;
    pending.push([a, b]);
  }
}

function processMerges() {
  while (pending.length) {
    const [a, b] = pending.shift();
    if (!potatoes.has(a) || !potatoes.has(b)) continue;
    const x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2, lv = a.lv;
    potatoes.delete(a); potatoes.delete(b);
    Composite.remove(engine.world, [a, b]);
    burst(x, y, lv);
    if (lv + 1 < N) {
      const nb = addPotato(x, y, lv + 1);
      Body.setVelocity(nb, { x: 0, y: -2 });
      talking.set(nb, performance.now());
      score += (lv + 1) * (lv + 2);
      announce(lv + 1);
      if (lv + 1 === N - 1 && !hole) startHole(nb);
    } else {
      score += 200;
      captionEl.textContent = 'DOUBLE ALPHA DUBB ! +200';
      captionEl.classList.remove('pop'); void captionEl.offsetWidth; captionEl.classList.add('pop');
      say(N - 1);
    }
    scoreEl.textContent = score;
  }
}

// tremblement façon gelée : chaque choc fait vibrer la patate
function updateWobble() {
  for (const b of potatoes) {
    const v = b.velocity, pv = b.prevV || v;
    const dv = Math.hypot(v.x - pv.x, v.y - pv.y);
    if (dv > 0.8) {
      b.wobV -= Math.min(0.12, dv * 0.035);
      b.wobDir = Math.atan2(v.y - pv.y, v.x - pv.x) + Math.PI / 2;
    }
    b.wobV += -b.wob * 0.22;
    b.wobV *= 0.86;
    b.wob = Math.max(-0.25, Math.min(0.25, b.wob + b.wobV));
    b.prevV = { x: v.x, y: v.y };
  }
}

function announce(lv) {
  captionEl.textContent = `LA PATATE ${LEVELS[lv].name}`;
  captionEl.classList.remove('pop'); void captionEl.offsetWidth; captionEl.classList.add('pop');
  say(lv); blip(lv);
  if (!seen.has(lv)) { seen.add(lv); buildChain(); }
}

function burst(x, y, lv) {
  const n = 10 + lv * 3;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 7, s = 1.5 + Math.random() * (2 + lv * .5);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue: LEVELS[lv].hue, sz: 2 + Math.random() * 3 });
  }
}

function drawNext() {
  nctx.clearRect(0, 0, 88, 88);
  drawPotato(nctx, 44, 44, 16 + nextLv * 6, nextLv);
}

// ---------- Contrôles ----------
function toWorldX(ev) {
  const rect = cv.getBoundingClientRect();
  return (ev.clientX - rect.left) / scale;
}
function clampX(x, lv) { const r = LEVELS[lv].r; return Math.max(r + 2, Math.min(W - r - 2, x)); }
cv.addEventListener('pointermove', ev => { aimX = toWorldX(ev); });
cv.addEventListener('pointerdown', ev => { aimX = toWorldX(ev); });
cv.addEventListener('pointerup', ev => { aimX = toWorldX(ev); drop(); });
addEventListener('keydown', ev => {
  if (ev.key === 'ArrowLeft') aimX -= 15;
  else if (ev.key === 'ArrowRight') aimX += 15;
  else if (ev.key === ' ' || ev.key === 'ArrowDown') { ev.preventDefault(); drop(); }
});
document.getElementById('test').onclick = () => {
  ensureAudio();
  const go = () => { const m = muted; muted = false; say(0); muted = m; };
  voiceBufs[0] ? go() : setTimeout(go, 300);
  captionEl.textContent = 'LA PATATE WILLIAM';
};
function drop() {
  ensureAudio();
  if (!canDrop || gameOver || hole) return;
  const dropLv = curLv;
  addPotato(clampX(aimX, dropLv), 50, dropLv);
  if (voiceBufs[dropLv]) say(dropLv, true); else setTimeout(() => say(dropLv, true), 300);
  canDrop = false;
  curLv = nextLv; nextLv = randLv(); drawNext();
  setTimeout(() => { canDrop = true; }, 550);
}
document.getElementById('again').onclick = () => { newGame(); };

// ---------- Trou noir : ALPHA DUBB aspire tout ----------
const HOLE_WAIT = 2300;   // le temps de dire « la patate alpha dubb »
function startHole(b) {
  hole = { b, start: performance.now(), sucking: false, x: b.position.x, y: b.position.y, k: 1, collapse: 0 };
  canDrop = false;
}
function beginSuck(now) {
  hole.sucking = true; hole.suckStart = now;
  hole.x = hole.b.position.x; hole.y = hole.b.position.y;
  for (const b of potatoes) {
    if (b === hole.b) continue;
    const dx = b.position.x - hole.x, dy = b.position.y - hole.y;
    sucked.push({ lv: b.lv, d: Math.hypot(dx, dy), th: Math.atan2(dy, dx), ang: b.angle, k: 1, x: b.position.x, y: b.position.y });
  }
  for (const b of [...potatoes]) if (b !== hole.b) { potatoes.delete(b); Composite.remove(engine.world, b); }
  potatoes.delete(hole.b);
  captionEl.textContent = 'LA SUPER PATATE ALPHA DUBB COSMIQUE';
  captionEl.classList.remove('pop'); void captionEl.offsetWidth; captionEl.classList.add('pop');
  say(6);
}
function updateHole(now, dt) {
  const el = now - hole.start, f = dt / 16.7;
  if (!hole.sucking) { if (el > HOLE_WAIT) beginSuck(now); return; }
  const se = now - hole.suckStart;
  // le trou noir glisse vers le centre du bocal
  hole.x += (W / 2 - hole.x) * 0.02 * f; hole.y += (H * 0.5 - hole.y) * 0.02 * f;
  Body.setPosition(hole.b, { x: hole.x, y: hole.y });
  Body.setAngle(hole.b, hole.b.angle + 0.03 * f);
  const R = LEVELS[N - 1].r;
  for (const s of sucked) {
    s.th += (0.02 + 9 / Math.max(s.d, 25)) * f;
    s.d = Math.max(0, s.d - (0.8 + 260 / Math.max(s.d, 30)) * f * Math.min(1, se / 600));
    s.k = Math.max(0, Math.min(1, (s.d - R * 0.2) / (R * 1.4)));
    s.ang += 0.2 * f;
    s.x = hole.x + Math.cos(s.th) * s.d; s.y = hole.y + Math.sin(s.th) * s.d;
  }
  for (const s of sucked) if (s.k <= 0.02) { hole.k = Math.min(1.35, hole.k + 0.04); burst(hole.x, hole.y, s.lv); }
  sucked = sucked.filter(s => s.k > 0.02);
  // étoiles aspirées
  if (stars.length < 90) for (let i = 0; i < 3; i++) {
    const a = Math.random() * 7, d = 260 + Math.random() * 200;
    stars.push({ th: a, d, sz: .8 + Math.random() * 2 });
  }
  for (const st of stars) { st.th += (0.01 + 6 / st.d) * f; st.d -= (1 + 300 / st.d) * f; }
  stars = stars.filter(st => st.d > R * 0.5);
  // fin : quand tout est aspiré et la phrase dite, le trou noir se referme
  if (!sucked.length && se > (voiceBufs[6] ? voiceBufs[6].duration * 1000 : 4200)) {
    hole.collapse = Math.min(1, hole.collapse + 0.025 * f);
    if (hole.collapse >= 1 && !gameOver) { score += 500; scoreEl.textContent = score; endGame(true); }
  }
  if (gameOver) hole.flash = Math.max(0, (hole.flash ?? 1) - 0.03 * f);
}
function drawHoleBack(now) {
  const R = LEVELS[N - 1].r, t = hole.sucking ? Math.min(1, (now - hole.suckStart) / 1200) : Math.min(0.35, (now - hole.start) / HOLE_WAIT * 0.35);
  const x = hole.sucking ? hole.x : hole.b.position.x, y = hole.sucking ? hole.y : hole.b.position.y;
  const sz = (1 - hole.collapse) * hole.k;
  // le bocal s'assombrit
  ctx.fillStyle = `rgba(5,3,15,${0.75 * t})`; ctx.fillRect(0, 0, W, H);
  // étoiles
  ctx.fillStyle = '#fff';
  for (const st of stars) {
    ctx.globalAlpha = Math.min(1, st.d / 200) * t;
    ctx.beginPath(); ctx.arc(x + Math.cos(st.th) * st.d, y + Math.sin(st.th) * st.d, st.sz, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (sz <= 0.01) return;
  // disque d'accrétion qui tourne
  ctx.save(); ctx.translate(x, y);
  for (let i = 0; i < 3; i++) {
    ctx.rotate(now / (600 - i * 150));
    const rr = R * sz * (1.35 + i * 0.35);
    const g = ctx.createRadialGradient(0, 0, R * sz * 0.9, 0, 0, rr * 1.2);
    g.addColorStop(0, `rgba(255,170,60,${0.75 * t})`);
    g.addColorStop(0.5, `rgba(170,70,255,${0.45 * t})`);
    g.addColorStop(1, 'rgba(60,0,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, rr * 1.25, rr * 0.55, i * 1.1, 0, 7); ctx.fill();
  }
  // halo noir
  const h = ctx.createRadialGradient(0, 0, R * sz * 0.8, 0, 0, R * sz * 1.5);
  h.addColorStop(0, `rgba(0,0,0,${0.9 * t})`); h.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = h; ctx.beginPath(); ctx.arc(0, 0, R * sz * 1.5, 0, 7); ctx.fill();
  ctx.restore();
}
function drawHoleFront(now) {
  if (!hole.sucking) return;
  const R = LEVELS[N - 1].r, sz = (1 - hole.collapse) * hole.k;
  // la patate trou noir : tourne, pulse, et s'assombrit sur les bords
  if (sz > 0.01) {
    const pulse = 1 + 0.04 * Math.sin(now / 90);
    drawPotato(ctx, hole.x, hole.y, R * sz * pulse, N - 1, hole.b.angle);
    const g = ctx.createRadialGradient(hole.x, hole.y, R * sz * 0.55, hole.x, hole.y, R * sz * pulse);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.75)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hole.x, hole.y, R * sz * pulse, 0, 7); ctx.fill();
  }
  // éclair final
  if (hole.collapse > 0.7) {
    ctx.fillStyle = `rgba(255,255,255,${(hole.collapse - 0.7) / 0.3 * 0.9 * (hole.flash ?? 1)})`;
    ctx.fillRect(0, 0, W, H);
  }
}
function endGame(win) {
  gameOver = true;
  const t = document.getElementById('overTitle');
  t.textContent = win ? 'VICTOIRE COSMIQUE' : 'LE BOCAL DÉBORDE';
  t.classList.toggle('win', win);
  document.getElementById('finalScore').textContent = `Score : ${score}`;
  overEl.hidden = false;
}

// ---------- Boucle ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(32, now - last); last = now;
  if (!gameOver && !(hole && hole.sucking)) { Engine.update(engine, dt); processMerges(); updateWobble(); }
  if (hole) updateHole(now, dt);

  // débordement
  let high = false;
  for (const b of potatoes) if (now - b.born > 1500 && b.position.y - LEVELS[b.lv].r < LINE) high = true;
  overTimer = high ? overTimer + dt : 0;
  if (!gameOver && !hole && overTimer > 1800) {
    gameOver = true;
    endGame(false);
  }

  ctx.clearRect(0, 0, W, H);
  // ligne danger
  ctx.save();
  ctx.setLineDash([8, 8]); ctx.lineWidth = 2;
  ctx.strokeStyle = overTimer > 0 ? `rgba(255,107,122,${.5 + .5 * Math.sin(now / 80)})` : 'rgba(169,162,199,.35)';
  ctx.beginPath(); ctx.moveTo(0, LINE); ctx.lineTo(W, LINE); ctx.stroke();
  ctx.restore();

  // visée
  if (!gameOver) {
    const x = clampX(aimX, curLv);
    ctx.strokeStyle = 'rgba(246,241,255,.15)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, 50); ctx.lineTo(x, H); ctx.stroke();
    if (canDrop) drawPotato(ctx, x, 50, LEVELS[curLv].r, curLv);
  }

  if (hole) drawHoleBack(now);
  for (const s of sucked) drawPotato(ctx, s.x, s.y, LEVELS[s.lv].r * s.k, s.lv, s.ang);
  for (const b of potatoes) {
    let talk = 0;
    const t0 = talking.get(b);
    if (t0 !== undefined) {
      const el = now - t0;
      if (el < 1400) talk = (Math.sin(el / 45) + 1) / 2; else talking.delete(b);
    }
    drawPotato(ctx, b.position.x, b.position.y, LEVELS[b.lv].r, b.lv, b.angle, talk, b);
  }

  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .025;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = `hsl(${p.hue} 80% 70%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (hole) drawHoleFront(now);
  requestAnimationFrame(frame);
}

resize();
newGame();
requestAnimationFrame(frame);
</script>
